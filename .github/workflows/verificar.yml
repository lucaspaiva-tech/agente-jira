name: verificar

# Roda a mesma verificação que o `scripts/verificar.sh` local: lint e testes.
# Se isto ficar vermelho, a mudança não entra.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    # Uma tarefa travada não deve segurar um runner por 6 horas.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: scripts/verificar.sh
