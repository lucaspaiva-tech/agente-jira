# Tema do app: paleta Buser (ver DESIGN.md). Este arquivo NÃO tem segredo e vai no ZIP do Hub.
# Visual de painel: conteúdo em branco (cartao), barra lateral em cinza claro (tela) com borda fio,
# cartões com borda e cantos arredondados. Tudo pelo tema nativo, sem CSS no Streamlit.

[theme]
primaryColor = "#e6006a"              # primaria-ativa: botão com texto branco passa AA (o #f11075 não passa)
backgroundColor = "#ffffff"           # cartao: fundo do conteúdo
secondaryBackgroundColor = "#fafafa"  # tela: fundo de campos e cabeçalho de tabela
textColor = "#454545"                 # tinta: texto de leitura, não é preto
borderColor = "#e0e0e0"               # fio: borda de 1px de cartões e campos
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]
# Títulos mais contidos (padrão do Streamlit: 2.75 / 2.25 / 1.75 / 1.5 / 1.25 / 1 rem).
headingFontSizes = ["2.25rem", "1.75rem", "1.375rem", "1.125rem", "1rem", "0.875rem"]
metricValueFontSize = "2rem"
dataframeHeaderBackgroundColor = "#fafafa"
# Cores semânticas da paleta: só pra dizer o que aconteceu (SLA, multa, erro).
greenColor = "#40b552"                # sucesso
redColor = "#dc2e36"                  # erro
orangeColor = "#e4ad1c"               # aviso

[theme.sidebar]
backgroundColor = "#fafafa"           # tela
secondaryBackgroundColor = "#ffffff"

[browser]
# O app é interno: sem telemetria.
gatherUsageStats = false

[client]
# Esconde o botão "Deploy" e o menu de desenvolvedor do Streamlit: quem usa vê só o app.
toolbarMode = "viewer"
